# The write roots placements.yaml needs. Copy this to write-roots.yaml in
# your brand directory and build with `just brand=<dir> build`, which compiles
# the roots in. Managed policy from MDM or Group Policy can add the same roots
# to any build, a stock one included. config.yaml cannot. A stock build
# writes only under its own directory, so without the policy it refuses every
# path here.
# https://sofcat.app/zip-items/placements/#write-roots
darwin:
  - /Library/Application Support/Example
  - /Library/Application Support/ClaudeCode
  - /etc/codex
windows:
  - ${ProgramData}\Example
  - ${ProgramData}\ClaudeCode
windows_user:
  - ${USERPROFILE}\.agents
